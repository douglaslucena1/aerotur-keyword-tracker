name: Collect Keyword Rankings

on:
  schedule:
    # Toda sexta-feira às 10:00 UTC = 07:00 de Brasília
    - cron: "0 10 * * 5"
  workflow_dispatch: # coleta manual (para testes)
    inputs:
      posicoes:
        description: "Posições no Google (DataForSEO, cerca de US$ 0,25)"
        type: boolean
        default: true
      leads:
        description: "Cliques no WhatsApp (GA4, grátis)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: coleta-do-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Posições no Google (DataForSEO)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.posicoes }}
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: node scripts/collect.js

      # Roda mesmo se a etapa anterior falhar; nesse caso o job fica vermelho, mas os dados que vieram são salvos.
      - name: Leads do WhatsApp (GA4)
        if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.leads) }}
        env:
          GA4_CLIENT_ID: ${{ secrets.GA4_CLIENT_ID }}
          GA4_CLIENT_SECRET: ${{ secrets.GA4_CLIENT_SECRET }}
          GA4_REFRESH_TOKEN: ${{ secrets.GA4_REFRESH_TOKEN }}
        run: node scripts/leads.js

      - name: Commit and push updated data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update radar data $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
